<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" fill="none">
  <!-- Visa Logo -->
  <defs>
    <linearGradient id="visaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1F71;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0B900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1F71;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Blue background -->
  <rect x="0" y="0" width="100" height="60" fill="#1A1F71" rx="4"/>
  <!-- Gold accent bar top -->
  <rect x="0" y="0" width="100" height="6" fill="#F0B900"/>
  <!-- Gold accent bar bottom -->
  <rect x="0" y="54" width="100" height="6" fill="#F0B900"/>
  <!-- VISA text -->
  <text x="50" y="38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="8">
    VISA
  </text>
</svg>