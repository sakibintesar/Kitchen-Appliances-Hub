<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- bKash Logo -->
  <defs>
    <linearGradient id="bkashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E30613;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4B2B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- bKash text -->
  <text x="10" y="42" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="url(#bkashGradient)">
    bKash
  </text>
  <!-- Pink dot over 'i' equivalent - small circle -->
  <circle cx="95" cy="18" r="4" fill="url(#bkashGradient)"/>
  <!-- Tagline -->
  <text x="10" y="56" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#E30613" opacity="0.8">
    Mobile Financial Service
  </text>
</svg>