<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Nagad Logo -->
  <defs>
    <linearGradient id="nagadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9F1A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Nagad icon - circular -->
  <circle cx="25" cy="30" r="24" fill="url(#nagadGradient)"/>
  <!-- N letter -->
  <text x="25" y="36" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">N</text>
  <!-- Nagad text -->
  <text x="58" y="42" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="url(#nagadGradient)">
    Nagad
  </text>
  <!-- Tagline -->
  <text x="58" y="56" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B00" opacity="0.8">
    Digital Financial Service
  </text>
</svg>